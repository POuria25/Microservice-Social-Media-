global:
  
  scrape_interval: 15s

  evaluation_interval: 15s

  external_labels:
    monitor: 'microservices-monitor'



rule_files:
  - 'rules.yml'    

scrape_configs:

  - job_name: 'gateway'

    scrape_interval: 15s
    
    scrape_timeout: 10s

    static_configs:
      - targets: ['gateway:8080']
        labels:
          service: 'gateway'
          environment : 'development'

    metrics_path: '/metrics'

    scheme: http

  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
